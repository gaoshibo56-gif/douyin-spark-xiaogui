name: 抖音续火花 · 云端定时

on:
  # 北京时间 21:00 = UTC 13:00；GitHub Actions 用 UTC，且常有数分钟延迟
  schedule:
    - cron: "0 13 * * *"
  # 也可手动从 GitHub 页面触发（对不熟悉 git 的人很友好）
  workflow_dispatch:
    inputs:
      account:
        description: "只运行指定账号ID（留空 = 全部启用账号）"
        required: false
        default: ""
      dry_run:
        description: "干跑测试（勾选后不真实发送）"
        type: boolean
        default: false

concurrency:
  group: douyin-spark
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      DS_REPO_VISIBILITY: ${{ github.event.repository.visibility }}
      # 如需给 Chrome 走代理（海外 runner 被风控时），在 Secrets 里配置，例如：
      # DS_PROXY = http://127.0.0.1:7890
      DS_PROXY: ${{ secrets.DS_PROXY }}
      DS_STATE_PASSPHRASE: ${{ secrets.DS_STATE_PASSPHRASE }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 缓存 Chromium 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Chromium 浏览器
        run: python -m playwright install --with-deps chromium

      - name: 运行发送
        env:
          ACCOUNT: ${{ github.event.inputs.account }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -e
          ARGS=""
          if [ -n "$ACCOUNT" ]; then ARGS="$ARGS --only $ACCOUNT"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry"; fi
          python ci/run.py $ARGS --summary "$GITHUB_STEP_SUMMARY"

      - name: 保存失败截图与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-artifacts
          path: |
            .ci-data/photos/
            .ci-data/logs/
            .ci-data/results.json
          if-no-files-found: ignore
          retention-days: 7
